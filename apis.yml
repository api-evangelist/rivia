name: Rivia
description: >-
  Rivia is a clinical trial intelligence platform based in Zurich, Switzerland
  that unifies fragmented clinical trial data from any vendor into a single,
  structured foundation for biotech and pharmaceutical companies. Its products
  include Rivia Core (data harmonization), Rivia Detect (AI agents that
  continuously identify and resolve data quality issues), and Rivia Spark
  (visual analytics with a conversational AI assistant for exploring trial
  data through natural language). The platform supports medical and clinical
  science, safety monitoring, clinical operations, and executive oversight use
  cases, promising go-live in under 20 days. Rivia raised a $15M Series A and
  is backed by investors including Earlybird and Speedinvest. The company is a
  sales-led enterprise platform with no public developer portal or API surface
  as of this profile; onboarding is via demo request.
